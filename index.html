<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#09070f">
<title>PStyla Games</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

:root{
  --purple:#9b5cff;
  --purple2:#6d28d9;
  --pink:#ec4899;
  --bg:#09070f;
  --panel:#100c19;
  --panel2:#151020;
  --text:#f5f3ff;
  --muted:#9b95aa;
  --border:rgba(255,255,255,.08);
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,rgba(155,92,255,.22),transparent 35%),
    radial-gradient(circle at 100% 30%,rgba(236,72,153,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.particle{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--size);
  height:var(--size);
  border-radius:50%;
  background:#b77aff;
  opacity:var(--opacity);
  animation:float var(--duration) linear infinite;
  animation-delay:var(--delay);
}

@keyframes float{
  0%{transform:translateY(30px)}
  100%{transform:translateY(-110vh)}
}

header{
  position:sticky;
  top:0;
  z-index:50;
  padding:16px 5%;
  background:rgba(9,7,15,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:24px;
  font-weight:1000;
  color:white;
  white-space:nowrap;
}

.logo span{
  color:var(--purple);
}

.searchWrap{
  flex:1;
}

#search{
  width:100%;
  padding:13px 18px;
  border-radius:14px;
  border:1px solid var(--border);
  outline:none;
  color:white;
  background:#120d1b;
}

#search:focus{
  border-color:var(--purple);
  box-shadow:0 0 20px rgba(155,92,255,.15);
}

.navButtons{
  display:flex;
  gap:8px;
}

.navButtons button{
  border:1px solid var(--border);
  background:#120d1b;
  color:white;
  border-radius:12px;
  padding:11px 14px;
}

.navButtons button:hover{
  border-color:var(--purple);
}

main{
  position:relative;
  z-index:1;
  max-width:1200px;
  margin:auto;
  padding:70px 5% 100px;
}

.welcomeSmall{
  color:var(--purple);
  font-size:11px;
  font-weight:900;
  letter-spacing:3px;
}

h1{
  font-size:clamp(42px,7vw,78px);
  margin:10px 0;
  line-height:.95;
}

.welcome p{
  color:var(--muted);
}

#gameCount{
  color:#c084fc;
  font-weight:900;
}

.featured{
  margin:45px 0;
  padding:40px;
  border-radius:25px;
  border:1px solid rgba(155,92,255,.25);
  background:
    radial-gradient(circle at 90% 20%,rgba(155,92,255,.25),transparent 35%),
    linear-gradient(135deg,#181025,#0d0914);
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.featuredLabel{
  color:#c084fc;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
}

.featured h2{
  font-size:38px;
  margin:12px 0;
}

.featured p{
  color:var(--muted);
  max-width:600px;
}

.playFeatured,.play,.random,.openHub,.next{
  border:0;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  color:white;
  font-weight:900;
  border-radius:12px;
  padding:12
